<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Canvas</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-container">
    <canvas id="game" width="1280" height="720" aria-label="Game screen"></canvas>
    <form id="name-entry" hidden>
      <input id="player-name" name="playerName" type="text" maxlength="9" aria-label="Player name" required>
    </form>
  </div>

  <script src="js/game-data.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/color-palette.js" defer></script>
  <script src="js/splash-screen.js" defer></script>
  <script src="js/story-intro.js" defer></script>
  <script src="js/player-data.js" defer></script>
  <script src="js/models/libram-data.js" defer></script>
  <script src="js/models/enemy-data.js" defer></script>
  <script src="js/data-manager.js" defer></script>
  <script src="js/character-select.js" defer></script>
  <script src="js/combat-manger.js" defer></script>
  <script src="../main-menu.js" defer></script>
  <script src="../canvas-manger.js" defer></script>
</body>
</html>
